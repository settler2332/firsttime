<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Liner 스타일의 미니멀 웹 계산기 - 깔끔한 선형 디자인" />
  <title>Liner Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scene">
    <div class="calc-wrapper">

      <!-- Header -->
      <div class="calc-header">
        <div class="header-dot"></div>
        <span class="header-title">CALC</span>
        <div class="header-dot"></div>
      </div>

      <!-- Calculator -->
      <div class="calculator" id="calculator">

        <!-- Display -->
        <div class="display" id="display">
          <div class="display-expression" id="expression"></div>
          <div class="display-value" id="result">0</div>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Buttons Grid -->
        <div class="btn-grid">

          <!-- Row 1 -->
          <button class="btn btn-fn" id="btn-ac" data-action="clear">AC</button>
          <button class="btn btn-fn" id="btn-sign" data-action="sign">+/−</button>
          <button class="btn btn-fn" id="btn-percent" data-action="percent">%</button>
          <button class="btn btn-op" id="btn-divide" data-action="operator" data-value="÷">÷</button>

          <!-- Row 2 -->
          <button class="btn btn-num" id="btn-7" data-action="number" data-value="7">7</button>
          <button class="btn btn-num" id="btn-8" data-action="number" data-value="8">8</button>
          <button class="btn btn-num" id="btn-9" data-action="number" data-value="9">9</button>
          <button class="btn btn-op" id="btn-multiply" data-action="operator" data-value="×">×</button>

          <!-- Row 3 -->
          <button class="btn btn-num" id="btn-4" data-action="number" data-value="4">4</button>
          <button class="btn btn-num" id="btn-5" data-action="number" data-value="5">5</button>
          <button class="btn btn-num" id="btn-6" data-action="number" data-value="6">6</button>
          <button class="btn btn-op" id="btn-subtract" data-action="operator" data-value="−">−</button>

          <!-- Row 4 -->
          <button class="btn btn-num" id="btn-1" data-action="number" data-value="1">1</button>
          <button class="btn btn-num" id="btn-2" data-action="number" data-value="2">2</button>
          <button class="btn btn-num" id="btn-3" data-action="number" data-value="3">3</button>
          <button class="btn btn-op" id="btn-add" data-action="operator" data-value="+">+</button>

          <!-- Row 5 -->
          <button class="btn btn-num btn-zero" id="btn-0" data-action="number" data-value="0">0</button>
          <button class="btn btn-num" id="btn-dot" data-action="decimal">.</button>
          <button class="btn btn-eq" id="btn-equal" data-action="equals">=</button>

        </div>

      </div>

      <!-- Footer -->
      <div class="calc-footer">
        <span class="footer-text">liner · v1.0</span>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
