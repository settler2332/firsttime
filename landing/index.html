<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI싱크클럽 오늘의 타로 — 세 장의 카드로 당신의 운세를 읽어드립니다" />
  <title>오늘의 타로 · AI SYNC CLUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function(){
      var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>

  <div class="page">

    <header class="site-header">
      <div class="header-dot"></div>
      <span class="header-label">AI SYNC CLUB</span>
      <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">LIGHT</button>
    </header>

    <main class="tarot-main">

      <!-- 인트로 -->
      <section class="tarot-intro" id="tarotIntro">
        <span class="tag">TODAY'S READING</span>
        <h1 class="tarot-page-title">오늘의<br>타로</h1>
        <p class="tarot-page-desc">
          세 장의 카드가 당신의<br>
          과거·현재·미래를 읽어드립니다.
        </p>
        <button class="btn-read" id="btnRead">운세 보기 →</button>
      </section>

      <!-- 리딩 결과 -->
      <section class="tarot-reading" id="tarotReading">
        <p class="tarot-reading-sub" id="tarotSub">카드를 뽑는 중입니다...</p>
        <div class="tarot-cards-row" id="tarotCardsRow"></div>
        <div class="tarot-fortune" id="tarotFortune"></div>

        <!-- 로또 번호 -->
        <div class="lotto-section" id="lottoSection">
          <div class="lotto-header">
            <span class="lotto-label">LOTTO · 이번 주 행운 번호</span>
            <button class="btn-lotto-refresh" id="btnLottoRefresh" aria-label="번호 재생성">↺</button>
          </div>
          <div class="lotto-games" id="lottoGames"></div>
          <div class="running-banner" id="runningBanner"></div>
        </div>

        <button class="btn-retry" id="btnRetry">다시 뽑기 ↺</button>
      </section>

    </main>

    <footer class="site-footer">
      <div class="header-dot"></div>
      <span class="footer-label">ai sync club · 2025</span>
      <div class="header-dot"></div>
    </footer>

  </div>

  <script src="script.js"></script>
  <script src="tarot.js"></script>
</body>
</html>
