<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI싱크클럽 오늘의 타로 — 세 장의 카드로 당신의 운세를 읽어드립니다" />
  <title>오늘의 타로 · AI SYNC CLUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function(){
      var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>

  <div class="page">

    <header class="site-header">
      <div class="header-dot"></div>
      <span class="header-label">AI SYNC CLUB</span>
      <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">LIGHT</button>
    </header>

    <!-- 뜀박질 입력 섹션 -->
    <section class="runner-section">
      <span class="tag runner-tag">RUNNING LOG</span>
      <h2 class="runner-title">R37 RUNNERS<br>뜀박질 입력</h2>
      <p class="runner-desc">날짜, 이름, 거리를 입력하면<br>구글 시트에 자동으로 기록됩니다.</p>

      <form class="run-form" id="runForm" novalidate>
        <div class="run-form-group">
          <label class="run-form-label" for="runDate">날짜</label>
          <input class="run-form-input" type="date" id="runDate" name="date" required />
        </div>
        <div class="run-form-group">
          <label class="run-form-label" for="runName">이름</label>
          <input class="run-form-input" type="text" id="runName" name="name" placeholder="이름을 입력하세요" required autocomplete="off" />
        </div>
        <div class="run-form-group">
          <label class="run-form-label" for="runDist">거리 (km)</label>
          <input class="run-form-input" type="number" id="runDist" name="distance"
                 placeholder="0.0" step="0.1" min="0.1" max="999" required />
        </div>
        <p class="run-form-status" id="runStatus"></p>
        <button class="run-form-submit run-submit-green" type="submit" id="runSubmit">저장하기 →</button>
      </form>
    </section>

    <!-- 타로 섹션 -->
    <main class="tarot-main">

      <section class="tarot-intro" id="tarotIntro">
        <span class="tag">TODAY'S READING</span>
        <h1 class="tarot-page-title">오늘의<br>타로</h1>
        <p class="tarot-page-desc">
          세 장의 카드가 당신의<br>
          과거·현재·미래를 읽어드립니다.
        </p>
        <button class="btn-read" id="btnRead">운세 보기 →</button>
      </section>

      <section class="tarot-reading" id="tarotReading">
        <p class="tarot-reading-sub" id="tarotSub">카드를 뽑는 중입니다...</p>
        <div class="tarot-cards-row" id="tarotCardsRow"></div>
        <div class="tarot-fortune" id="tarotFortune"></div>

        <div class="lotto-section" id="lottoSection">
          <div class="lotto-header">
            <span class="lotto-label">LOTTO · 이번 주 행운 번호</span>
            <button class="btn-lotto-refresh" id="btnLottoRefresh" aria-label="번호 재생성">↺</button>
          </div>
          <div class="lotto-games" id="lottoGames"></div>
          <div class="running-banner" id="runningBanner"></div>
        </div>

        <button class="btn-retry" id="btnRetry">다시 뽑기 ↺</button>
      </section>

    </main>

    <footer class="site-footer">
      <div class="header-dot"></div>
      <span class="footer-label">ai sync club · 2025</span>
      <div class="header-dot"></div>
    </footer>

  </div>

  <script src="script.js"></script>
  <script src="tarot.js"></script>
  <script src="runner.js"></script>
</body>
</html>
